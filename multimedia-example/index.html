<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Ejercicio 13 - Mi Biblioteca</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="https://kit.fontawesome.com/27879825a4.js" crossorigin="anonymous"></script>
    <style>
        section {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        section article a {
            text-decoration: none;
            width: 550px;
            height: 400px;
            display: block;
            font-weight: bold;
            color: white;
            border-radius: 20px;
            display: flex;
            margin: 1rem;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            text-shadow: 4px 4px 5px rgba(0, 0, 0, .75);
            transition: all 0.2s ease;
        }

        section article a:hover {
            transform: scale(1.05);
            color: var(--color-4);
        }

        section article a:active {
            transform: scale(1);
        }

        #musica {
            background: url(imgs/musica.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }

        #peliculas {
            background: url(imgs/cine.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }

        #juegos {
            background: url(imgs/juegos.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }
    </style>
</head>

                    <li><a href="juegos.html"><i class="fa-solid fa-gamepad"></i> JUEGOS</a></li>
                    <li><a href="musica.html"><i class="fa-solid fa-music"></i> DISCOS</a></li>
                </ul>
            </nav>
            <div id="cuerpo">
                <h2>Menú Principal</h2>
                <section id="enlaces">
